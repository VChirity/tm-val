name: Deploy TM Val (Flutter Web)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar assets/.env para o build
        run: |
          mkdir -p flutter_app/assets
          cat > flutter_app/assets/.env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Build Flutter Web
        run: |
          cd flutter_app
          flutter pub get
          flutter build web --release --base-href="/${{ github.event.repository.name }}/"

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: flutter_app/build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy TM Val ${{ github.sha }}"

      - name: Apontar GitHub Pages para gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" -X PUT \
            -f build_type=legacy \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/' || true
